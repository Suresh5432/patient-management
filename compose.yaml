services:
  billing-service:
    image: billing-service:local
    build:
      context: ./billing-service
    networks:
      - internal

  patient-service:
    image: patient-service:local
    build:
      context: ./patient-service
    depends_on:
      - billing-service
    networks:
      - internal
    environment:
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: "9001"
    ports:
      - "4000:4000"

  api-gateway:
    image: api-gateway:local
    build:
      context: ./api-gateway
    depends_on:
      - patient-service
    networks:
      - internal
    ports:
      - "4005:4005"

networks:
  internal:
    driver: bridge
    name: internal
