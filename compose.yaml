services:
  patient-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d patientdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  billing-service:
    image: billing-service:latest
    build: ./billing-service
    networks: [internal]

  patient-service:
    image: patient-service:latest
    build: ./patient-service
    depends_on:
      billing-service: {condition: service_started}
      patient-postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: "9001"
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-postgres:5432/patientdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [internal]

  auth-service:
    image: auth-service:latest
    build: ./auth-service
    depends_on:
      auth-postgres: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SEED_DEMO_USER: "true"
    ports: ["4006:4006"]
    networks: [internal]

  analytics-service:
    image: analytics-service:latest
    build: ./analytics-service
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [internal]

  api-gateway:
    image: api-gateway:latest
    build: ./api-gateway
    depends_on:
      - patient-service
      - auth-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:4006
    networks: [internal]
    ports: ["4010:4005"]

networks:
  internal:
    driver: bridge
    name: internal
